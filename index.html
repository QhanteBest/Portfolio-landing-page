<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio landing Page</title>
    <link rel="stylesheet" href="./styles/style.css"/>

<body>

        <div class="logo">
            <span class="logo-gradient">XEST</span><br>

            <span class="hero-gradient">MIAMI</span><br>

        </p>
        <button class="hero-btn">Book A Call</button>
        </div>
